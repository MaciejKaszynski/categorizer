[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "categorize"
version = "0.1.0"
description = "A CLI tool to categorize scans."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "maciej" }]
dependencies = ["pypdf", "pytesseract", "pillow", "ollama", "pyinsane2", "pydantic"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
categorize = "categorize.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
